<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet"href="style.css">
</head>
<body>
    <h1>Simple todo List</h1>

    <div id="filter-btns">
  <button class="filter active" data-filter="all">All</button>
  <button class="filter" data-filter="active">Active</button>
  <button class="filter" data-filter="completed">Completed</button>
</div>
<p id="counter"></p>

    <!--input and button to add new todos-->
    <input type="text" id="todo-input" placeholder="Enter a todo and press add or Enter">

    <button id="add-btn">Add</button>
    <ul id="todo-list"></ul>

    <div id="progress" style="width:380px;height:6px;background:#f0d9c6;border-radius:10px;margin:18px 0">
  <div id="progress-fill" style="height:100%;background:#3d2b1f;width:0%;border-radius:10px"></div>
</div>

    <script src="javascript.js"></script>
</body>
</html>
